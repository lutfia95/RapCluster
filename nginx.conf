server {
    listen 8080;
    server_name _;

    # RapCluster accepts data files up to 50 MB. nginx allows a little more so that the
    # application itself rejects larger files with a clear message (multipart adds overhead).
    client_max_body_size 55M;

    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/json text/plain text/css text/tab-separated-values application/javascript image/svg+xml;

    # Clear JSON message if nginx itself rejects an upload.
    error_page 413 = @upload_too_large;
    location @upload_too_large {
        default_type application/json;
        return 413 '{"error": "The upload is larger than the RapCluster web server (nginx) limit of 55 MB.", "code": "upload_too_large", "limit_mb": 50, "limit_source": "RapCluster web server (nginx)"}';
    }

    location = /rapcluster {
        return 301 /rapcluster/;
    }

    location /rapcluster/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /rapcluster/index.html;
    }

    location /rapcluster/api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;

        # Analyses run as background jobs, so API requests are short; the timeouts only
        # need to cover uploads, result downloads and ZIP generation.
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
