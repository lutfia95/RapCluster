[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

[program:gunicorn]
; Job memory and concurrency limits come from the Dockerfile ENV (overridable per machine in compose.yaml).
; Analyses run in separate job processes, so requests are short; threads keep status polling responsive.
command=gunicorn --bind 127.0.0.1:5000 --workers 2 --threads 4 --timeout 120 app:app
directory=/app
user=appuser
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PYTHONDONTWRITEBYTECODE="1",PYTHONUNBUFFERED="1",MPLCONFIGDIR="/tmp/matplotlib",NUMBA_CACHE_DIR="/tmp/numba_cache",RAPCLUSTER_MAX_UPLOAD_MB="50",RAPCLUSTER_JOB_TIMEOUT_SECONDS="600",RAPCLUSTER_MAX_PLOT_POINTS="5000"

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
