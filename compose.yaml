services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8088:8080"
    restart: unless-stopped
    # The image allows 8 runs at once with 10 GB each (for the 100 GB server).
    # On a smaller machine, lower the limits here: runs x memory + 3 GB should fit into the RAM.
    # environment:
    #   RAPCLUSTER_JOB_MEMORY_MB: "3072"
    #   RAPCLUSTER_MAX_CONCURRENT_JOBS: "3"
