services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8088:8080"
    restart: unless-stopped
    depends_on:
      - assistant
    # The image allows 8 runs at once with 10 GB each (for the 100 GB server).
    # On a smaller machine, lower the limits here: runs x memory + 3 GB + ~7 GB for the assistant should fit into the RAM.
    environment:
      RAPCLUSTER_ASSISTANT_URL: "http://assistant:11434"
      RAPCLUSTER_ASSISTANT_MODEL: "qwen2.5:7b"
    #   RAPCLUSTER_JOB_MEMORY_MB: "3072"
    #   RAPCLUSTER_MAX_CONCURRENT_JOBS: "3"

  # Clustering Assistant: Qwen2.5 7B Instruct on the CPU via Ollama (about 6-7 GB RAM). The model is downloaded while the
  # image is built (the first build takes a few minutes longer). Only the app container can reach it.
  assistant:
    build:
      context: ./llm-server
      args:
        RAPCLUSTER_ASSISTANT_MODEL: "qwen2.5:7b"
    restart: unless-stopped
