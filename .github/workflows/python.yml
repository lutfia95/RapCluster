name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the version in the Dockerfile; 3.12 checks a current Python.
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Check syntax
        run: python -m compileall -q app.py preprocessing.py exploration.py characterization.py stability.py sweep.py rapcluster_reproduce.py
      - name: Smoke tests
        run: python -m pytest -q tests
