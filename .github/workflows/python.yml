name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # The official Python images instead of setup-python: python:3.9-slim is the Dockerfile's base image
    # (GitHub no longer builds Python 3.9 for current Ubuntu runners); 3.12 checks a current Python.
    container: python:${{ matrix.python-version }}-slim
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    env:
      MPLCONFIGDIR: /tmp/matplotlib
      NUMBA_CACHE_DIR: /tmp/numba_cache
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools (as in the Dockerfile)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential gcc g++
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Check syntax
        run: python -m compileall -q app.py preprocessing.py exploration.py characterization.py stability.py sweep.py rapcluster_reproduce.py
      - name: Smoke tests
        run: python -m pytest -q tests
